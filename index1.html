<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>My map</title>
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <style> body { margin: 0; } #map { position: absolute; inset: 0; } </style>
</head>
<body>
  <div id="map"></div>
  <div id="legend" style="
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 1;
  background: white;
  padding: 12px;
  border-radius: 6px;
  font: 14px sans-serif;
">
  <strong>Map layers</strong>

  <label style="display:block; margin-top:8px">
    <input type="checkbox" checked
      onchange="toggleLayer('bear-icons', this.checked)">
    Bear sightings
  </label>

  <label style="display:block; margin-top:8px">
    <input type="checkbox" checked
      onchange="toggleLayer('park', this.checked)">
    Parks
  </label>

  <label style="display:block; margin-top:8px">
    <input type="checkbox" checked
      onchange="toggleLayer('urban', this.checked)">
    Urban areas
  </label>

  <label style="display:block; margin-top:8px">
    <input type="checkbox" checked
      onchange="toggleLayer('highway_minor', this.checked)">
    Minor roads
  </label>
</div>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: 'style.json',        // the file you downloaded from Maputnik
      center: [-123.25, 49.26],    // longitude, latitude
      zoom: 11
    });
    map.addControl(new maplibregl.NavigationControl());
  </script>
</body>
</html>
